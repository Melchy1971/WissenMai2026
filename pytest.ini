[pytest]
testpaths = backend/tests
pythonpath = backend
addopts = --strict-markers
# ──────────────────────────────────────────────────────────────────────────────
# TRUTH MARKER SPLIT
#
# Gate markers (7):
#   M4-GATE  → m4_truth, m4a_auth_truth, m4b_upload_queue_truth,
#               m4c_lifecycle_retrieval_truth, m4e_backup_restore_truth
#   NON-BLOCKING → m5_truth, governance_truth
#
# Rules:
#   1. M4-Gate evaluates only the five M4 markers above.
#   2. m5_truth and governance_truth do NOT block M4.
#   3. Any test in postgres_truth/ without a gate marker aborts collection.
#   4. Split reports are written automatically after each run.
#
# Run M4-Gate only:    python scripts/run_m4_gate.py
# Run full truth:      pytest -m "postgres_truth"
# Taxonomy check:      WISSEN_MARKER_TAXONOMY_ONLY=1 pytest --collect-only
# ──────────────────────────────────────────────────────────────────────────────
markers =
    # ── Pre-M4 ────────────────────────────────────────────────────────────────
    frontend_truth: Frontend/Backend contract truth; blocks M3a
    m3a_truth: M3a backend baseline truth

    # ── M4-GATE markers (block M4 release if failing) ─────────────────────────
    m4_truth: M4 backend stabilization truth; blocks M4 release
    m4a_auth_truth: M4a auth and workspace isolation truth; M4-gate
    m4b_upload_queue_truth: M4b upload, import queue and job recovery truth; M4-gate
    m4c_lifecycle_retrieval_truth: M4c document lifecycle, search, retrieval and chat truth; M4-gate
    m4e_backup_restore_truth: M4e backup and restore truth; M4-gate

    # ── NON-BLOCKING markers (informational; do not block M4) ─────────────────
    m5_truth: M5 operational hardening truth; non-blocking for M4
    governance_truth: Governance, cleanup, reindex and longevity truth; non-blocking for M4
    observability_truth: Observability truth; non-blocking for M4

    # ── Supplementary category markers ────────────────────────────────────────
    chaos_truth: Chaos and race-condition truth
    slow_truth: Slow truth simulations and benchmarks
    unit_fast: Fast unit tests that are included in split reporting but do not gate M4

    # ── Infrastructure markers ─────────────────────────────────────────────────
    postgres: requires a real PostgreSQL database - set TEST_DATABASE_URL or use docker-compose.test.yml
    postgres_truth: hard PostgreSQL truth tests; TEST_DATABASE_URL and migration preflight failures are gate-blocking

    # ── Legacy aliases (do not use in new tests) ──────────────────────────────
    m4a_gate: legacy alias for m4a_auth_truth; must run as postgres_truth
    m4b_gate: legacy alias for m4b_upload_queue_truth; must run as postgres_truth
    m4c_gate: legacy alias for m4c_lifecycle_retrieval_truth; must run as postgres_truth
    m4d_gate: legacy M4 diagnostics marker

    # ── Sub-category markers (always paired with a gate marker) ───────────────
    auth_bootstrap: Auth bootstrap stability truth tests
    workspace_bootstrap: Workspace bootstrap stability truth tests
    queue_aging: Queue Aging and Starvation Detection truth tests
    reindex_governance: Reindex Governance safety constraints and audit trail truth tests
    citation_longevity: Citation Longevity Audit - long-term snapshot stability truth tests
    cleanup_governance: Cleanup Governance safety constraints and audit trail truth tests
    m5_cleanup: M5 Cleanup process truth tests
    entropy: Long-term entropy and system aging detection truth tests
